name: Refresh Sessionize CFPs

on:
  schedule:
    - cron: '45 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Refresh all public matching Sessionize CFPs
        run: python scripts/refresh_sessionize.py
      - name: Refresh open CFPs from Confs.tech
        run: python scripts/refresh_confstech.py
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sessionize-opportunities.js confstech-opportunities.js
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: refresh Sessionize CFP catalog"
            git push
          fi
